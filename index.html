e:1.2em}\n#tut .head small{color:#05705e;font-weight:600}\n#tut .stt{display:grid;grid-template-columns:repeat(3,1fr);gap:.5em}\n#tut .stt div{background:#e7fefa;border-radius:.5em;padding:.35em .6em;border-left:.25em solid #0bf4cd;font-size:.85em}\n#tut .stt b{display:block;font-size:1.2em}\n#tut .paper{background:#fff;border:1px solid #cdeee8;border-radius:.4em;padding:.7em;box-shadow:0 .5em 1.4em rgba(3,68,57,.25);text-align:center}\n#tut .paper .ln{height:.55em;border-radius:99px;background:#d9efea;margin:.45em 0}\n#tut .tip{display:flex;align-items:center;gap:.8em;background:#fff;border:1px solid #cdeee8;border-radius:.8em;padding:.7em .9em;font-weight:600}\n#tut .tip .m-b{width:2.6em;height:2.6em;animation:float 2.4s infinite}\n#tut .ptr{position:absolute;right:-.3em;bottom:-1.6em;width:1.8em;height:1.8em;z-index:4;pointer-events:none;animation:ptr 1.2s var(--d,0s) both}\n#tut .ptr svg{width:100%;height:100%;fill:#022b24;stroke:#fff;stroke-width:1.5;filter:drop-shadow(0 .1em .2em rgba(0,0,0,.4))}\n#tut .ptr i{position:absolute;left:-.4em;top:-.4em;width:1.4em;height:1.4em;border-radius:50%;border:.2em solid #0bf4cd;animation:ripple .8s calc(var(--d,0s) + 1.2s) 2 both}\n#tut .a-pop{animation:pop .5s var(--d,0s) both cubic-bezier(.2,.8,.2,1)}\n#tut .a-up{animation:up .5s var(--d,0s) both cubic-bezier(.2,.8,.2,1)}\n@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}\n@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}\n@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}\n@keyframes reveal{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}\n@keyframes fly{0%{opacity:0;transform:translate(70%,-160%) rotate(10deg)}50%{opacity:1}100%{opacity:1;transform:translate(0,3.2em)}}\n@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(11,244,205,.8)}50%{box-shadow:0 0 0 .5em rgba(11,244,205,0)}}\n@keyframes ptr{0%{opacity:0;transform:translate(4em,3em)}30%{opacity:1}100%{opacity:1;transform:translate(0,0)}}\n@keyframes ripple{0%{transform:scale(.3);opacity:1}100%{transform:scale(2.2);opacity:0}}\n@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-.35em)}}\n@keyframes cap{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}\n#tut .paused *,#tut .paused *::before,#tut .paused *::after{animation-play-state:paused!important}\n@media (prefers-reduced-motion:reduce){#tut .m *{animation-duration:.01s!important;animation-delay:0s!important}}\n<\/style>\n<\/head>\n<body>\n\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\">\n  <symbol id=\"i-logo\" viewBox=\"0 0 24 24\"><path d=\"M3 17l5-5 4 4 8-9\"/><path d=\"M15 7h5v5\"/><\/symbol>\n  <symbol id=\"i-building\" viewBox=\"0 0 24 24\"><path d=\"M3 21h18M5 21V7l7-4 7 4v14M9 21v-4h6v4M9 10h.01M12 10h.01M15 10h.01M9 13h.01M12 13h.01M15 13h.01\"/><\/symbol>\n  <symbol id=\"i-users\" viewBox=\"0 0 24 24\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/><\/symbol>\n  <symbol id=\"i-book\" viewBox=\"0 0 24 24\"><path d=\"M4 19.5V4.5A2.5 2.5 0 0 1 6.5 2H20v15H6.5A2.5 2.5 0 0 0 4 19.5zm0 0A2.5 2.5 0 0 0 6.5 22H20v-5\"/><\/symbol>\n  <symbol id=\"i-cal\" viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"18\" rx=\"2\"/><path d=\"M16 2v4M8 2v4M3 10h18\"/><\/symbol>\n  <symbol id=\"i-sliders\" viewBox=\"0 0 24 24\"><path d=\"M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6\"/><\/symbol>\n  <symbol id=\"i-upload\" viewBox=\"0 0 24 24\"><path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12\"/><\/symbol>\n  <symbol id=\"i-award\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"8\" r=\"6\"/><path d=\"M15.5 13.5 17 22l-5-3-5 3 1.5-8.5\"/><\/symbol>\n  <symbol id=\"i-chart\" viewBox=\"0 0 24 24\"><path d=\"M3 3v18h18M7 15v3M12 9v9M17 5v13\"/><\/symbol>\n  <symbol id=\"i-print\" viewBox=\"0 0 24 24\"><pa 7\" y=\"2\" width=\"10\" height=\"20\" rx=\"2\"/><path d=\"M11 18h2\"/><\/symbol>\n<\/svg>\n\n<nav class=\"nav\"><div class=\"nav-in\">\n  <a class=\"brand\" href=\"#tool\"><span class=\"lg\"><svg class=\"ic\"><use href=\"#i-logo\"/><\/svg><\/span><span>Score Converter<\/span><\/a>\n  <div class=\"tabs\">\n    <a class=\"tab on\" data-v=\"tool\" href=\"#tool\"><svg class=\"ic\"><use href=\"#i-chart\"/><\/svg>Converter<\/a>\n    <a class=\"tab\" data-v=\"ielts\" href=\"#ielts\"><svg class=\"ic\"><use href=\"#i-award\"/><\/svg>Band Score<\/a>\n    <a class=\"tab\" data-v=\"tut\" href=\"#tutorial\"><svg class=\"ic\"><use href=\"#i-play\"/><\/svg>Tutorial<\/a>\n    <a class=\"lang\" id=\"langLink\" href=\"#\" data-lang=\"bn\" lang=\"bn\">বাংলা<\/a>\n  <\/div>\n<\/div><\/nav>\n\n<div id=\"viewTool\">\n<header class=\"hero\">\n  <div class=\"hero-in\">\n    <div>\n      <h1><span class=\"logo\"><svg class=\"ic\"><use href=\"#i-logo\"/><\/svg><\/span>Score Converter<\/h1>\n      <p class=\"sub\">Convert exam marks to a new total and see each student’s new score and grade.<\/p>\n      <div class=\"strip\" aria-hidden=\"true\"><i style=\"background:#e7fefa\"><\/i><i style=\"background:#bbfcf1\"><\/i><i style=\"background:#8ffae8\"><\/i><i style=\"background:#63f8df\"><\/i><i style=\"background:#27f5d3\"><\/i><i style=\"background:#0bf4cd\"><\/i><i style=\"background:#079c83\"><\/i><i style=\"background:#05705e\"><\/i><i style=\"background:#034439\"><\/i><i style=\"background:#011814\"><\/i><\/div>\n      <a class=\"hero-link\" href=\"#tutorial\"><svg class=\"ic\"><use href=\"#i-play\"/><\/svg>How does it work? Watch the tutorial<\/a>\n      <a class=\"hero-link\" href=\"#ielts\" style=\"margin-left:8px;background:#e7fefa\"><svg class=\"ic\"><use href=\"#i-award\"/><\/svg>Band Score and CEFR<\/a>\n    <\/div>\n    <svg class=\"art\" viewBox=\"0 0 170 120\" aria-hidden=\"true\">\n      <line x1=\"8\" y1=\"106\" x2=\"162\" y2=\"106\" stroke=\"#8ffae8\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\".6\"/>\n      <rect x=\"18\" y=\"62\" width=\"30\" height=\"44\" rx=\"5\" fill=\"#63f8df\" opacity=\".35\"/>\n      <rect x=\"70\" y=\"40\" width=\"30\" height=\"66\" rx=\"5\" fill=\"#27f5d3\" opacity=\".6\"/>\n      <rect x=\"122\" y=\"14\" width=\"30\" height=\"92\" rx=\"5\" fill=\"#0bf4cd\"/>\n      <path d=\"M33 52 Q77 8 122 8\" fill=\"none\" stroke=\"#e7fefa\" stroke-width=\"2\" stroke-dasharray=\"4 5\" stroke-linecap=\"round\"/>\n      <path d=\"M116 3l7 5-7 5\" fill=\"none\" stroke=\"#e7fefa\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n    <\/svg>\n  <\/div>\n  <div class=\"ruler\" aria-hidden=\"true\"><\/div>\n<\/header>\n\n<div class=\"page\">\n<aside class=\"ad ad-l\" id=\"slotL\" data-w=\"160\" data-h=\"600\" aria-label=\"Advertisement\"><\/aside>\n<main class=\"wrap\">\n\n  <section class=\"step\" id=\"sInfo\">\n    <div class=\"rail\"><div class=\"badge\"><svg class=\"ic\"><use href=\"#i-building\"/><\/svg><em>1<\/em><\/div><\/div>\n    <div class=\"card\">\n      <h2>Exam details<small>This information appears at the top of the printed result<\/small><\/h2>\n      <div class=\"grid\">\n        <div class=\"wide\"><label for=\"inst\">Institution name<\/label><div class=\"inp\"><svg class=\"ic\"><use href=\"#i-building\"/><\/svg><input id=\"inst\" placeholder=\"e.g. Adarsha High School\"><\/div><\/div>\n        <div><label for=\"batch\">Batch / Class<\/label><div class=\"inp\"><svg class=\"ic\"><use href=\"#i-users\"/><\/svg><input id=\"batch\" placeholder=\"e.g. Class 9, Batch 2026\"><\/div><\/div>\n        <div><label for=\"subj\">Subject<\/label><div class=\"inp\"><svg class=\"ic\"><use href=\"#i-book\"/><\/svg><input id=\"subj\" placeholder=\"e.g. Mathematics\"><\/div><\/div>\n        <div><label for=\"edate\">Exam date<\/label><div class=\"inp\"><svg class=\"ic\"><use href=\"#i-cal\"/><\/svg><input id=\"edate\" type=\"date\"><\/div><\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"step\" id=\"sSet\">\n    <div class=\"rail\"><div class=\"badge\"><svg class=\"ic\"><use href=\"#i-sliders\"/><\/svg><em>2<\/em><\/div><\/div>\n    <div class=\"card\">\n      <h2>Conversion settings<\/h2>\n      <div class=\"grid\">\n        <div><label for=\"orig\">Original total<\/label><input id=\"orig\" type=\"number\" min=\"1\" value=\"100\"><\/div>\n        <div><label for=\"target\">New total<\/label><input id=\"target\" type=\"number\" min=\"1\" value=\"80\"><\/div>\n        <div><label for=\"method\">Conversion method<\/label>\n          <select id=\"method\">\n            <option value=\"top\">Highest-score based<\/option>\n            <option value=\"ratio\">Proportional (new ÷ original)<\/option>\n          <\/select>\n        <\/div>\n        <div id=\"baseBox\"><label for=\"base\">Base score (leave empty to use the highest score)<\/label><input id=\"base\" type=\"number\" min=\"1\" placeholder=\"Automatic\"><\/div>\n        <div><label for=\"dec\">Decimal places<\/label>\n          <select id=\"dec\"><option value=\"0\">0 (whole number)<\/option><option value=\"1\">1 place<\/option><option value=\"2\" selected>2 places<\/option><\/select>\n        <\/div>\n      <\/div>\n      <div class=\"formula\"><svg class=\"ic\"><use href=\"#i-swap\"/><\/svg><span id=\"formula\"><\/span><\/div>\n      <div class=\"hint\">Highest-score based: the student with the highest mark (e.g. 70) gets the new total (e.g. 80), and everyone else is scaled in proportion.<\/div>\n      <div class=\"hint\">Set the original and new totals as you like (e.g. 10 → 100, 15 → 100 or 100 → 80). To scale a small total up to a larger one, choose the ‘Proportional’ method.<\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"step\" id=\"sData\">\n    <div class=\"rail\"><div class=\"badge\"><svg class=\"ic\"><use href=\"#i-upload\"/><\/svg><em>3<\/em><\/div><\/div>\n    <div class=\"card\">\n      <h2>Enter student scores<\/h2>\n      <div class=\"drop\" id=\"drop\">\n        <label for=\"file\"><svg class=\"ic\"><use href=\"#i-file\"/><\/svg><b>Upload an Excel (.xlsx) or CSV file<\/b><\/label>\n        <div class=\"hint\" style=\"margin:2px 0 8px\">The file needs two columns named ‘Name’ and ‘Score’. An optional ‘Comment’ column is also read. You can also drag the file here.<\/div>\n        <input type=\"file\" id=\"file\" accept=\".xlsx,.xls,.csv\">\n        <div class=\"row\" style=\"margin-top:10px\">\n          <button id=\"demoXlsx\"><svg class=\"ic\"><use href=\"#i-down\"/><\/svg>Demo Excel<\/button>\n          <button id=\"demoCsv\"><svg class=\"ic\"><use href=\"#i-down\"/><\/svg>Demo CSV<\/button>\n        <\/div>\n        <div class=\"msg\" id=\"fileMsg\"><\/div>\n      <\/div>\n      <label for=\"bulk\">Or paste everything at once (one line each: name, score, optional comment)<\/label>\n      <textarea id=\"bulk\" placeholder=\"Rahim, 68, Excellent work&#10;Karim, 55, Needs more practice&#10;Sumi, 70\"><\/textarea>\n      <div class=\"row\">\n        <button class=\"primary\" id=\"loadBulk\"><svg class=\"ic\"><use href=\"#i-plus\"/><\/svg>Add to list<\/button>\n        <button id=\"addRow\"><svg class=\"ic\"><use href=\"#i-plus\"/><\/svg>One row<\/button>\n        <button id=\"sample\">See example<\/button>\n        <button id=\"clear\"><svg class=\"ic\"><use href=\"#i-trash\"/><\/svg>Clear all<\/button>\n      <\/div>\n      <div class=\"scroll\" style=\"margin-top:16px\">\n        <table style=\"min-width:760px\">\n          <thead><tr><th style=\"width:56px\">No.<\/th><th>Name<\/th><th style=\"width:150px\">Original score<\/th><th style=\"min-width:220px\">Comment<\/th><th style=\"width:56px\"><\/th><\/tr><\/thead>\n          <tbody id=\"inputBody\"><\/tbody>\n        <\/table>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"step\" id=\"sGrade\">\n    <div class=\"rail\"><div class=\"badge\"><svg class=\"ic\"><use href=\"#i-award\"/><\/svg><em>4<\/em><\/div><\/div>\n    <div class=\"card\">\n      <h2>Grading scale<small>Based on the percentage of the new score; editable<\/small><\/h2>\n      <div class=\"scroll\">\n        <table style=\"min-width:420px\">\n          <thead><tr><th>Minimum %<\/th><th>Grade<\/th><th>GPA<\/th><\/tr><\/thead>\n          <tbody id=\"gradeBody\"><\/tbody>\n        <\/table>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"step\" id=\"sResult\">\n    <div class=\"rail\"><div class=\"badge\"><svg class=\"ic\"><use href=\"#i-chart\"/><\/svg><em>5<\/em><\/div><\/div>\n    <div class=\"card\">\n      <h2>Result<\/h2>\n      <div class=\"sheet-head\" id=\"sheetHead\"><\/div>\n      <div id=\"results\"><\/div>\n      <div class=\"row\" id=\"actions\" style=\"display:none\">\n        <button class=\"primary\" id=\"print\"><svg class=\"ic\"><use href=\"#i-print\"/><\/svg>Print<\/button>\n        <button id=\"pdf\"><svg class=\"ic\"><use href=\"#i-file\"/><\/svg>Download PDF<\/button>\n        <button id=\"xlsx\"><svg class=\"ic\"><use href=\"#i-down\"/><\/svg>Excel<\/button>\n        <button id=\"csv\"><svg class=\"ic\"><use href=\"#i-down\"/><\/svg>CSV<\/button>\n        <button id=\"copy\"><svg class=\"ic\"><use href=\"#i-copy\"/><\/svg><span>Copy<\/span><\/button>\n      <\/div>\n    <\/div>\n  <\/section>\n\n<\/main>\n<aside class=\"ad ad-r\" id=\"slotR\" data-w=\"160\" data-h=\"600\" aria-label=\"Advertisement\"><\/aside>\n<\/div>\n<div class=\"ad ad-m\" id=\"slotM\" data-w=\"300\" data-h=\"250\" aria-label=\"Advertisement\"><\/div>\n\n<\/div>\n\n<section id=\"viewIelts\" hidden>\n<header class=\"hero\"><div class=\"hero-in\"><div>\n  <h1><span class=\"logo\"><svg class=\"ic\"><use href=\"#i-award\"/><\/svg><\/span>Band Score and CEFR Converter<\/h1>\n  <p class=\"sub\">Enter subject scores for IELTS, KET, PET and YLE (Starters, Movers, Flyers) or upload a file, and get the band/scale score and CEFR level.<\/p>\n  <div class=\"strip\" aria-hidden=\"true\"><i style=\"background:#e7fefa\"><\/i><i style=\"background:#bbfcf1\"><\/i><i style=\"background:#8ffae8\"><\/i><i style=\"background:#63f8df\"><\/i><i style=\"background:#27f5d3\"><\/i><i style=\"background:#0bf4cd\"><\/i><i style=\"background:#079c83\"><\/i><i style=\"background:#05705e\"><\/i><i style=\"background:#034439\"><\/i><i style=\"background:#011814\"><\/i><\/div>\n<\/div><\/div><div class=\"ruler\" aria-hidden=\"true\"><\/div><\/header>\n<main class=\"wrap\">\n  <section class=\"step\" id=\"ieInfo\">\n    <div class=\"rail\"><div class=\"badge\"><svg class=\"ic\"><use href=\"#i-building\"/><\/svg><em>1<\/em><\/div><\/div>\n    <div class=\"card\">\n      <h2>Exam type and report details<small>Details are optional and appear at the top of the printout<\/small><\/h2>\n      <div class=\"grid\" style=\"margin-bottom:16px\"><div class=\"wide\"><label for=\"ieExam\">Exam type<\/label>\n        <select id=\"ieExam\">\n          <option value=\"ielts\">IELTS (band 0–9)<\/option>\n          <option value=\"ket\">KET / A2 Key (scale 100–150)<\/option>\n          <option value=\"pet\">PET / B1 Preliminary (scale 100–170)<\/option>\n          <option value=\"starters\">YLE: Pre A1 Starters<\/option>\n          <option value=\"movers\">YLE: A1 Movers<\/option>\n          <option value=\"flyers\">YLE: A2 Flyers<\/option>\n        <\/select>\n        <div class=\"formula\" style=\"margin-top:10px\"><svg class=\"ic\"><use href=\"#i-award\"/><\/svg><span id=\"ieExamNote\"><\/span><\/div>\n      <\/div><\/div>\n      <div class=\"grid\">\n        <div class=\"wide\"><label for=\"ieInst\">Institution name<\/label><div class=\"inp\"><svg class=\"ic\"><use href=\"#i-building\"/><\/svg><input id=\"ieInst\" placeholder=\"e.g. ABC Academy\"><\/div><\/div>\n        <div><label for=\"ieBatch\">Batch / Class<\/label><div class=\"inp\"><svg class=\"ic\"><use href=\"#i-users\"/><\/svg><input id=\"ieBatch\" placeholder=\"e.g. Batch 12\"><\/div><\/div>\n        <div><label for=\"ieDate\">Exam date<\/label><div class=\"inp\"><svg class=\"ic\"><use href=\"#i-cal\"/><\/svg><input id=\"ieDate\" type=\"date\"><\/div><\/div>\n      <\/div><\/div>\n  <\/section>\n  <section class=\"step\" id=\"ieSubj\">\n    <div class=\"rail\"><div class=\"badge\"><svg class=\"ic\"><use href=\"#i-sliders\"/><\/svg><em>2<\/em><\/div><\/div>\n    <div class=\"card\">\n      <h2>Subjects and conversion method<small>The method is chosen automatically from the name; change it if you like<\/small><\/h2>\n      <div class=\"scroll\"><table style=\"min-width:600px\">\n        <thead><tr><th>Subject<\/th><th style=\"width:110px\">Total<\/th><th style=\"width:210px\">Method<\/th><th style=\"width:70px;text-align:center\">Counts<\/th><th style=\"width:50px\"><\/th><\/tr><\/thead>\n        <tbody id=\"ieSubBody\"><\/tbody>\n      <\/table><\/div>\n      <datalist id=\"ieNames\"><option value=\"Listening\"><option value=\"Reading\"><option value=\"Writing\"><option value=\"Speaking\"><option value=\"Grammar\"><option value=\"Vocabulary\"><option value=\"Pronunciation\"><\/datalist>\n      <div class=\"row\">\n        <button class=\"primary\" id=\"ieAddSub\"><svg class=\"ic\"><use href=\"#i-plus\"/><\/svg>Add subject<\/button>\n        <button id=\"ie4\">Default subjects<\/button>\n        <button id=\"ie5\">Default + Grammar<\/button>\n      <\/div>\n      <div class=\"hint\" id=\"ieHint\"><\/div><\/div>\n  <\/section>\n  <section class=\"step\" id=\"ieData\">\n    <div class=\"rail\"><div class=\"badge\"><svg class=\"ic\"><use href=\"#i-upload\"/><\/svg><em>3<\/em><\/div><\/div>\n    <div class=\"card\">\n      <h2>Enter candidate scores<\/h2>\n      <div class=\"drop\" id=\"ieDrop\">\n        <label for=\"ieFile\"><svg class=\"ic\"><use href=\"#i-file\"/><\/svg><b>Upload an Excel (.xlsx) or CSV file<\/b><\/label>\n        <div class=\"hint\" style=\"margin:2px 0 8px\">The first column is ‘Name’; the other column headers are subject names. To set a total, write Grammar/50 or Grammar (50). For a single candidate, a two-column ‘Subject, Score’ file also works.<\/div>\n        <input type=\"file\" id=\"ieFile\" accept=\".xlsx,.xls,.csv\">\n        <div class=\"row\" style=\"margin-top:10px\">\n          <button id=\"ieDemoXlsx\"><svg class=\"ic\"><use href=\"#i-down\"/><\/svg>Demo Excel<\/button>\n          <button id=\"ieDemoCsv\"><svg class=\"ic\"><use href=\"#i-down\"/><\/svg>Demo CSV<\/button>\n          <button id=\"ieSample\">See example<\/button>\n        <\/div>\n        <div class=\"msg\" id=\"ieMsg\"><\/div>\n      <\/div>\n      <div class=\"hint\" style=\"margin:0 0 8px\">Or enter the scores yourself in the table below:<\/div>\n      <div class=\"scroll\"><table style=\"min-width:560px\"><thead id=\"ieStuHead\"><\/thead><tbody id=\"ieStuBody\"><\/tbody><\/table><\/div>\n      <div class=\"row\">\n        <button class=\"primary\" id=\"ieAddStu\"><svg class=\"ic\"><use href=\"#i-plus\"/><\/svg>Add candidate<\/button>\n        <button id=\"ieClear\"><svg class=\"ic\"><use href=\"#i-trash\"/><\/svg>Clear scores<\/button>\n      <\/div><\/div>\n  <\/section>\n  <section class=\"step\" id=\"ieResult\">\n    <div class=\"rail\"><div class=\"badge\"><svg class=\"ic\"><use href=\"#i-chart\"/><\/svg><em>4<\/em><\/div><\/div>\n    <div class=\"card\">\n      <h2>Result<\/h2>\n      <div class=\"sheet-head\" id=\"ieHead\"><\/div>\n      <div id=\"ieRes\"><\/div>\n      <div class=\"row\" id=\"ieActions\" style=\"display:none\">\n        <button class=\"primary\" id=\"iePrint\"><svg class=\"ic\"><use href=\"#i-print\"/><\/svg>Print<\/button>\n        <button id=\"ieXlsx\"><svg class=\"ic\"><use href=\"#i-down\"/><\/svg>Excel<\/button>\n        <button id=\"ieCsv\"><svg class=\"ic\"><use href=\"#i-down\"/><\/svg>CSV<\/button>\n      <\/div><\/div>\n  <\/section>\n<\/main>\n<\/section>\n\n<section id=\"tut\" hidden>\n<div class=\"top\"><div class=\"top-in\">\n  <div class=\"tt\"><span class=\"logo\"><svg class=\"ic\"><use href=\"#i-logo\"/><\/svg><\/span>Score Converter — Tutorial<\/div>\n  <a class=\"lnk p\" href=\"#tool\"><svg class=\"ic\"><use href=\"#i-chart\"/><\/svg>Use the tool<\/a>\n<\/div><\/div>\n<div class=\"main\">\n  <div class=\"tbar\">\n    <p>See step by step how to use it on mobile and computer.<\/p>\n    <div class=\"seg2\">\n      <button id=\"bPc\"><svg class=\"ic\"><use href=\"#i-laptop\"/><\/svg>Computer<\/button>\n      <button id=\"bMob\"><svg class=\"ic\"><use href=\"#i-phone\"/><\/svg>Mobile<\/button>\n    <\/div>\n  <\/div>\n\n  <div class=\"stage pc\" id=\"stage\">\n    <div class=\"lab\"><span class=\"bd\" id=\"lIc\"><\/span><div><small id=\"lNo\"><\/small><span id=\"lT\"><\/span><\/div><\/div>\n    <div class=\"dev\"><div class=\"bezel\"><div class=\"scr\" id=\"scr\"><\/div><\/div><div class=\"base\"><\/div><\/div>\n    <div class=\"cap\" id=\"cap\" aria-live=\"polite\"><\/div>\n  <\/div>\n\n  <div class=\"ctl\">\n    <button id=\"bPlay\" class=\"on\" aria-label=\"Play/Pause\"><\/button>\n    <button id=\"bPrev\" aria-label=\"Previous step\"><svg class=\"ic\"><use href=\"#i-prev\"/><\/svg><\/button>\n    <button id=\"bNext\" aria-label=\"Next step\"><svg class=\"ic\"><use href=\"#i-next\"/><\/svg><\/button>\n    <div class=\"segs\" id=\"segs\"><\/div>\n  <\/div>\n  <div class=\"hint\">Keyboard: Space = play/pause, ← → = change step<\/div>\n<\/div>\n<\/section>\n\n<footer>Created by <a href=\"https://www.facebook.com/mdsahjalal.net\" target=\"_blank\" rel=\"noopener noreferrer\">Md Shahjalal<\/a><\/footer>\n\n<template id=\"ad-left\"><\/template>\n<template id=\"ad-right\"><\/template>\n<template id=\"ad-mobile\"><\/template>\n\n<script>\n(function(){\n  var $ = function(id){return document.getElementById(id)};\n  var grades = [\n    {min:80,g:\"A+\",gp:5},{min:70,g:\"A\",gp:4},{min:60,g:\"A-\",gp:3.5},\n    {min:50,g:\"B\",gp:3},{min:40,g:\"C\",gp:2},{min:33,g:\"D\",gp:1},{min:0,g:\"F\",gp:0}\n  ];\n  var students = [];\n  var bn = \"০১২৩৪৫৬৭৮৯\";\n  var months = [\"January\",\"February\",\"March\",\"April\",\"May\",\"June\",\"July\",\"August\",\"September\",\"October\",\"November\",\"December\"];\n  function ic(n){return '<svg class=\"ic\"><use href=\"#i-'+n+'\"/><\/svg>'}\n  function toBn(s){return String(s)}\n  function fromBn(s){return String(s).replace(/[০-৯]/g,function(d){return bn.indexOf(d)})}\n  function num(v){var n=parseFloat(fromBn(v).replace(/,/g,\".\"));return isNaN(n)?null:n}\n  function esc(s){return String(s).replace(/[&<>\"]/g,function(c){return {\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]})}\n  function fmt(n,d){return toBn(Number(n.toFixed(d)).toString())}\n  function fmtDate(v){\n    var m=/^(\\d{4})-(\\d{2})-(\\d{2})$/.exec(v||\"\"); if(!m) return \"\";\n    return toBn(parseInt(m[3],10))+\" \"+months[parseInt(m[2],10)-1]+\", \"+toBn(m[1]);\n  }\n\n  /* ---- exam info ---- */\n  var infoIds=[\"inst\",\"batch\",\"subj\",\"edate\"];\n  function getInfo(){return {inst:$(\"inst\").value.trim(),batch:$(\"batch\").value.trim(),subj:$(\"subj\").value.trim(),date:fmtDate($(\"edate\").value)}}\n  try{var saved=JSON.parse(localStorage.getItem(\"scInfo\")||\"{}\");infoIds.forEach(function(k){if(saved[k])$(k).value=saved[k]})}catch(e){}\n  infoIds.forEach(function(k){$(k).addEventListener(\"input\",function(){\n    try{var o={};infoIds.forEach(function(i){o[i]=$(i).value});localStorage.setItem(\"scInfo\",JSON.stringify(o))}catch(e){}\n    renderHead();\n  })});\n  function renderHead(){\n    var i=getInfo(), c=compute();\n    var h = i.inst ? '<h3>'+esc(i.inst)+'<\/h3>' : '<h3 class=\"ph\">Institution name<\/h3>';\n    h+='<div class=\"t\">Exam result<\/div><div class=\"meta\">';\n    if(i.batch) h+='<span>'+ic(\"users\")+esc(i.batch)+'<\/span>';\n    if(i.subj)  h+='<span>'+ic(\"book\")+'Subject: '+esc(i.subj)+'<\/span>';\n    if(i.date)  h+='<span>'+ic(\"cal\")+esc(i.date)+'<\/span>';\n    h+='<\/div><div class=\"conv\">Original total '+fmt(c.orig,2)+' → New total '+fmt(c.target,2)+'<\/div>';\n    $(\"sheetHead\").innerHTML=h;\n  }\n\n  /* ---- grades ---- */\n  function renderGrades(){\n    $(\"gradeBody\").innerHTML = grades.map(function(r,i){\n      return '<tr><td><input type=\"number\" min=\"0\" max=\"100\" value=\"'+r.min+'\" data-i=\"'+i+'\" data-k=\"min\"><\/td>'+\n             '<td><input value=\"'+esc(r.g)+'\" data-i=\"'+i+'\" data-k=\"g\"><\/td>'+\n             '<td><input type=\"number\" step=\"0.01\" value=\"'+r.gp+'\" data-i=\"'+i+'\" data-k=\"gp\"><\/td><\/tr>';\n    }).join(\"\");\n  }\n  $(\"gradeBody\").addEventListener(\"input\",function(e){\n    var t=e.target,i=t.dataset.i,k=t.dataset.k; if(i==null)return;\n    grades[i][k] = k===\"g\" ? t.value : (parseFloat(t.value)||0);\n    renderResults();\n  });\n  function gradeOf(pct){\n    var sorted = grades.slice().sort(function(a,b){return b.min-a.min});\n    for(var i=0;i<sorted.length;i++) if(pct>=sorted[i].min) return sorted[i];\n    return sorted[sorted.length-1] || {g:\"-\",gp:0};\n  }\n\n  /* ---- student inputs ---- */\n  function renderInputs(){\n    $(\"inputBody\").innerHTML = students.map(function(s,i){\n      return '<tr><td>'+toBn(i+1)+'<\/td>'+\n        '<td><input value=\"'+esc(s.name)+'\" data-i=\"'+i+'\" data-k=\"name\" placeholder=\"Student name\"><\/td>'+\n        '<td><input type=\"number\" min=\"0\" step=\"any\" value=\"'+(s.score===null?\"\":s.score)+'\" data-i=\"'+i+'\" data-k=\"score\"><\/td>'+\n        '<td><input value=\"'+esc(s.comment||\"\")+'\" data-i=\"'+i+'\" data-k=\"comment\" placeholder=\"Write a comment…\"><\/td>'+\n          '<td><button class=\"x\" data-del=\"'+i+'\" aria-label=\"Delete\">'+ic(\"x\")+'<\/button><\/td><\/tr>';\n    }).join(\"\");\n  }\n  $(\"inputBody\").addEventListener(\"input\",function(e){\n    var t=e.target,i=t.dataset.i,k=t.dataset.k; if(i==null)return;\n    students[i][k] = k===\"score\" ? num(t.value) : t.value;\n    renderResults();\n  });\n  $(\"inputBody\").addEventListener(\"click\",function(e){\n    var b=e.target.closest(\"button[data-del]\"); if(!b)return;\n    students.splice(+b.dataset.del,1); renderInputs(); renderResults();\n  });\n\n  /* ---- compute & render ---- */\n  function compute(){\n    var orig=num($(\"orig\").value)||100, target=num($(\"target\").value)||80;\n    var dec=+$(\"dec\").value, method=$(\"method\").value;\n    var valid=students.filter(function(s){return s.score!==null&&s.score!==undefined});\n    var max=valid.reduce(function(m,s){return Math.max(m,s.score)},0);\n    var baseIn=num($(\"base\").value);\n    var base = method===\"top\" ? (baseIn||max||orig) : orig;\n    return {orig:orig,target:target,dec:dec,method:method,max:max,base:base,factor:target/base};\n  }\n  function renderResults(){\n    var c=compute();\n    $(\"baseBox\").style.display = c.method===\"top\" ? \"\" : \"none\";\n    $(\"formula\").innerHTML = c.method===\"top\"\n      ? 'New score = (original score ÷ <b>'+fmt(c.base,2)+'<\/b>) × <b>'+fmt(c.target,2)+'<\/b>'\n      : 'New score = original score × (<b>'+fmt(c.target,2)+'<\/b> ÷ <b>'+fmt(c.orig,2)+'<\/b>)';\n    if(c.method===\"top\"&&c.target>c.orig)$(\"formula\").innerHTML+=' <small style=\"color:var(--warn)\">(choose ‘Proportional’ to scale up)<\/small>';\n    renderHead();\n\n    var rows = students.filter(function(s){return s.score!==null&&s.score!==undefined}).map(function(s){\n      var ns = Number(Math.min(s.score*c.factor, c.target).toFixed(c.dec));\n      var pct = ns/c.target*100, gr = gradeOf(pct);\n      return {name:s.name||\"—\",old:s.score,ns:ns,pct:pct,g:gr.g,gp:gr.gp,cm:String(s.comment||\"\").trim()};\n    });\n    if(!rows.length){\n      $(\"results\").innerHTML='<div class=\"empty\">Add scores to see the results here.<\/div>';\n      $(\"actions\").style.display=\"none\"; window._rows=[]; return;\n    }\n    window._rows=rows; window._c=c;\n    var avgOld=rows.reduce(function(a,r){return a+r.old},0)/rows.length;\n    var avgNew=rows.reduce(function(a,r){return a+r.ns},0)/rows.length;\n    var pass=rows.filter(function(r){return r.g!==\"F\"}).length;\n    var top=Math.max.apply(null,row =\"2\" stroke-linecap=\"round\" opacity=\".6\"/>\n      <rect x=\"18\" y=\"62\" width=\"30\" height=\"44\" rx=\"5\" fill=\"#63f8df\" opacity=\".35\"/>\n      <rect x=\"70\" y=\"40\" width=\"30\" height=\"66\" rx=\"5\" fill=\"#27f5d3\" opacity=\".6\"/>\n      <rect x=\"122\" y=\"14\" width=\"30\" height=\"92\" rx=\"5\" fill=\"#0bf4cd\"/>\n      <path d=\"M33 52 Q77 8 122 8\" fill=\"none\" stroke=\"#e7fefa\" stroke-width=\"2\" stroke-dasharray=\"4 5\" stroke-linecap=\"round\"/>\n      <path d=\"M116 3l7 5-7 5\" fill=\"none\" stroke=\"#e7fefa\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n    <\/svg>\n  <\/div>\n  <div class=\"ruler\" aria-hidden=\"true\"><\/div>\n<\/header>\n\n<div class=\"page\">\n<aside class=\"ad ad-l\" id=\"slotL\" data-w=\"160\" data-h=\"600\" aria-label=\"বিজ্ঞাপন\"><\/aside>\n<main class=\"wrap\">\n\n  <section class=\"step\" id=\"sInfo\">\n    <div class=\"rail\"><div class=\"badge\"><svg class=\"ic\"><use href=\"#i-building\"/><\/svg><em>১<\/em><\/div><\/div>\n    <div class=\"card\">\n      <h2>পরীক্ষার তথ্য<small>এই তথ্য ফলাফল প্রিন্টের উপরে বসবে<\/small><\/h2>\n      <div class=\"grid\">\n        <div class=\"wide\"><label for=\"inst\">প্রতিষ্ঠানের নাম<\/label><div class=\"inp\"><svg class=\"ic\"><use href=\"#i-building\"/><\/svg><input id=\"inst\" placeholder=\"যেমন: আদর্শ উচ্চ বিদ্যালয়\"><\/div><\/div>\n        <div><label for=\"batch\">ব্যাচ / শ্রেণি<\/label><div class=\"inp\"><svg class=\"ic\"><use href=\"#i-users\"/><\/svg><input id=\"batch\" placeholder=\"যেমন: নবম শ্রেণি, ব্যাচ ২০২৬\"><\/div><\/div>\n        <div><label for=\"subj\">বিষয়<\/label><div class=\"inp\"><svg class=\"ic\"><use href=\"#i-book\"/><\/svg><input id=\"subj\" placeholder=\"যেমন: গণিত\"><\/div><\/div>\n        <div><label for=\"edate\">পরীক্ষার তারিখ<\/label><div class=\"inp\"><svg class=\"ic\"><use href=\"#i-cal\"/><\/svg><input id=\"edate\" type=\"date\"><\/div><\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"step\" id=\"sSet\">\n    <div class=\"rail\"><div class=\"badge\"><svg class=\"ic\"><use href=\"#i-sliders\"/><\/svg><em>২<\/em><\/div><\/div>\n    <div class=\"card\">\n      <h2>কনভার্সনের সেটিং<\/h2>\n      <div class=\"grid\">\n        <div><label for=\"orig\">মূল পূর্ণমান<\/label><input id=\"orig\" type=\"number\" min=\"1\" value=\"100\"><\/div>\n        <div><label for=\"target\">নতুন পূর্ণমান<\/label><input id=\"target\" type=\"number\" min=\"1\" value=\"80\"><\/div>\n        <div><label for=\"method\">কনভার্সন পদ্ধতি<\/label>\n          <select id=\"method\">\n            <option value=\"top\">সর্বোচ্চ নম্বর ভিত্তিক<\/option>\n            <option value=\"ratio\">সমানুপাতিক (নতুন ÷ মূল)<\/option>\n          <\/select>\n        <\/div>\n        <div id=\"baseBox\"><label for=\"base\">ভিত্তি নম্বর (খালি রাখলে সর্বোচ্চ নম্বর)<\/label><input id=\"base\" type=\"number\" min=\"1\" placeholder=\"স্বয়ংক্রিয়\"><\/div>\n        <div><label for=\"dec\">দশমিক ঘর<\/label>\n          <select id=\"dec\"><option value=\"0\">০ (পূর্ণসংখ্যা)<\/option><option value=\"1\">১ ঘর<\/option><option value=\"2\" selected>২ ঘর<\/option><\/select>\n        <\/div>\n      <\/div>\n      <div class=\"formula\"><svg class=\"ic\"><use href=\"#i-swap\"/><\/svg><span id=\"formula\"><\/span><\/div>\n      <div class=\"hint\">সর্বোচ্চ নম্বর ভিত্তিক: যিনি সবচেয়ে বেশি পেয়েছেন (যেমন ৭০) তিনি নতুন পূর্ণমান (যেমন ৮০) পাবেন, বাকিরা সেই অনুপাতে।<\/div>\n      <div class=\"hint\">মূল ও নতুন পূর্ণমান নিজের মতো বসান (যেমন ১০ → ১০০, ১৫ → ১০০ বা ১০০ → ৮০)। ছোট পূর্ণমান থেকে বড় করতে ‘সমানুপাতিক’ পদ্ধতি বাছুন।<\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"step\" id=\"sData\">\n    <div class=\"rail\"><div class=\"badge\"><svg class=\"ic\"><use href=\"#i-upload\"/><\/svg><em>৩<\/em><\/div><\/div>\n    <div class=\"card\">\n      <h2>শিক্ষার্থীর নম্বর দিন<\/h2>\n      <div class=\"drop\" id=\"drop\">\n        <label for=\"file\"><svg class=\"ic\"><use href=\"#i-file\"/><\/svg><b>Excel (.xlsx) বা CSV ফাইল আপলোড করুন<\/b><\/label>\n        <div class=\"hint\" style=\"margin:2px 0 8px\">ফাইলে ‘নাম’ ও ‘নম্বর’ নামে দুটি কলাম থাকতে হবে। ‘মন্তব্য’ কলাম থাকলে সেটিও পড়া হবে। ফাইল এখানে ড্র্যাগও করা যায়।<\/div>\n        <input type=\"file\" id=\"file\" accept=\".xlsx,.xls,.csv\">\n        <div class=\"row\" style=\"margin-top:10px\">\n          <button id=\"demoXlsx\"><svg class=\"ic\"><use href=\"#i-down\"/><\/svg>ডেমো Excel<\/button>\n          <button id=\"demoCsv\"><svg class=\"ic\"><use href=\"#i-down\"/><\/svg>ডেমো CSV<\/button>\n        <\/div>\n        <div class=\"msg\" id=\"fileMsg\"><\/div>\n      <\/div>\n      <label for=\"bulk\">অথবা একসাথে পেস্ট করুন (প্রতি লাইনে: নাম, নম্বর, মন্তব্য)<\/label>\n      <textarea id=\"bulk\" placeholder=\"রহিম, 68, চমৎকার ফল&#10;করিম, 55, আরও অনুশীলন দরকার&#10;সুমি, 70\"><\/textarea>\n      <div class=\"row\">\n        <button class=\"primary\" id=\"loadBulk\"><svg class=\"ic\"><use href=\"#i-plus\"/><\/svg>তালিকায় যোগ করুন<\/button>\n        <button id=\"addRow\"><svg class=\"ic\"><use href=\"#i-plus\"/><\/svg>একটি সারি<\/button>\n        <button id=\"sample\">উদাহরণ দেখুন<\/button>\n        <button id=\"clear\"><svg class=\"ic\"><use href=\"#i-trash\"/><\/svg>সব মুছুন<\/button>\n      <\/div>\n      <div class=\"scroll\" style=\"margin-top:16px\">\n        <table style=\"min-width:760px\">\n          <thead><tr><th style=\"width:56px\">ক্রম<\/th><th>নাম<\/th><th style=\"width:150px\">মূল নম্বর<\/th><th style=\"min-width:220px\">মন্তব্য<\/th><th style=\"width:56px\"><\/th><\/tr><\/thead>\n          <tbody id=\"inputBody\"><\/tbody>\n        <\/table>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"step\" id=\"sGrade\">\n    <div class=\"rail\"><div class=\"badge\"><svg class=\"ic\"><use href=\"#i-award\"/><\/svg><em>৪<\/em><\/div><\/div>\n    <div class=\"card\">\n      <h2>গ্রেডিং স্কেল<small>নতুন স্কোরের শতকরা হারে; পরিবর্তন করা যায়<\/small><\/h2>\n      <div class=\"scroll\">\n        <table style=\"min-width:420px\">\n          <thead><tr><th>ন্যূনতম %<\/th><th>গ্রেড<\/th><th>জিপিএ<\/th><\/tr><\/thead>\n          <tbody id=\"gradeBody\"><\/tbody>\n        <\/table>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"step\" id=\"sResult\">\n    <div class=\"rail\"><div class=\"badge\"><svg class=\"ic\"><use href=\"#i-chart\"/><\/svg><em>৫<\/em><\/div><\/div>\n    <div class=\"card\">\n      <h2>ফলাফল<\/h2>\n      <div class=\"sheet-head\" id=\"sheetHead\"><\/div>\n      <div id=\"results\"><\/div>\n      <div class=\"row\" id=\"actions\" style=\"display:none\">\n        <button class=\"primary\" id=\"print\"><svg class=\"ic\"><use href=\"#i-print\"/><\/svg>প্রিন্ট<\/button>\n        <button id=\"pdf\"><svg class=\"ic\"><use href=\"#i-file\"/><\/svg>PDF ডাউনলোড<\/button>\n        <button id=\"xlsx\"><svg class=\"ic\"><use href=\"#i-down\"/><\/svg>Excel<\/button>\n        <button id=\"csv\"><svg class=\"ic\"><use href=\"#i-down\"/><\/svg>CSV<\/button>\n        <button id=\"copy\"><svg class=\"ic\"><use href=\"#i-copy\"/><\/svg><span>কপি<\/span><\/button>\n      <\/div>\n    <\/div>\n  <\/section>\n\n<\/main>\n<aside class=\"ad ad-r\" id=\"slotR\" data-w=\"160\" data-h=\"600\" aria-label=\"বিজ্ঞাপন\"><\/aside>\n<\/div>\n<div class=\"ad ad-m\" id=\"slotM\" data-w=\"300\" data-h=\"250\" aria-label=\"বিজ্ঞাপন\"><\/div>\n\n<\/div>\n\n<section id=\"viewIelts\" hidden>\n<header class=\"hero\"><div class=\"hero-in\"><div>\n  <h1><span class=\"logo\"><svg class=\"ic\"><use href=\"#i-award\"/><\/svg><\/span>ব্যান্ড স্কোর ও CEFR কনভার্টার<\/h1>\n  <p class=\"sub\">IELTS, KET, PET ও YLE (Starters, Movers, Flyers) এর বিষয়ভিত্তিক স্কোর বসান বা ফাইল আপলোড করুন, ব্যান্ড/স্কেল স্কোর ও CEFR লেভেল বের হয়ে আসবে।<\/p>\n  <div class=\"strip\" aria-hidden=\"true\"><i style=\"background:#e7fefa\"><\/i><i style=\"background:#bbfcf1\"><\/i><i style=\"background:#8ffae8\"><\/i><i style=\"background:#63f8df\"><\/i><i style=\"background:#27f5d3\"><\/i><i style=\"background:#0bf4cd\"><\/i><i style=\"background:#079c83\"><\/i><i style=\"background:#05705e\"><\/i><i style=\"background:#034439\"><\/i><i style=\"background:#011814\"><\/i><\/div>\n<\/div><\/div><div class=\"ruler\" aria-hidden=\"true\"><\/div><\/header>\n<main class=\"wrap\">\n  <section class=\"step\" id=\"ieInfo\">\n    <div class=\"rail\"><div class=\"badge\"><svg class=\"ic\"><use href=\"#i-building\"/><\/svg><em>১<\/em><\/div><\/div>\n    <div class=\"card\">\n      <h2>পরীক্ষার ধরন ও রিপোর্টের তথ্য<small>তথ্যগুলো ঐচ্ছিক, প্রিন্টের উপরে বসবে<\/small><\/h2>\n      <div class=\"grid\" style=\"margin-bottom:16px\"><div class=\"wide\"><label for=\"ieExam\">পরীক্ষার ধরন<\/label>\n        <select id=\"ieExam\">\n          <option value=\"ielts\">IELTS (ব্যান্ড ০–৯)<\/option>\n          <option value=\"ket\">KET / A2 Key (স্কেল ১০০–১৫০)<\/option>\n          <option value=\"pet\">PET / B1 Preliminary (স্কেল ১০০–১৭০)<\/option>\n          <option value=\"starters\">YLE: Pre A1 Starters<\/option>\n          <option value=\"movers\">YLE: A1 Movers<\/option>\n          <option value=\"flyers\">YLE: A2 Flyers<\/option>\n        <\/select>\n        <div class=\"formula\" style=\"margin-top:10px\"><svg class=\"ic\"><use href=\"#i-award\"/><\/svg><span id=\"ieExamNote\"><\/span><\/div>\n      <\/div><\/div>\n      <div class=\"grid\">\n        <div class=\"wide\"><label for=\"ieInst\">প্রতিষ্ঠানের নাম<\/label><div class=\"inp\"><svg class=\"ic\"><use href=\"#i-building\"/><\/svg><input id=\"ieInst\" placeholder=\"যেমন: ABC Academy\"><\/div><\/div>\n        <div><label for=\"ieBatch\">ব্যাচ / শ্রেণি<\/label><div class=\"inp\"><svg class=\"ic\"><use href=\"#i-users\"/><\/svg><input id=\"ieBatch\" placeholder=\"যেমন: Batch 12\"><\/div><\/div>\n        <div><label for=\"ieDate\">পরীক্ষার তারিখ<\/label><div class=\"inp\"><svg class=\"ic\"><use href=\"#i-cal\"/><\/svg><input id=\"ieDate\" type=\"date\"><\/div><\/div>\n      <\/div><\/div>\n  <\/section>\n  <section class=\"step\" id=\"ieSubj\">\n    <div class=\"rail\"><div class=\"badge\"><svg class=\"ic\"><use href=\"#i-sliders\"/><\/svg><em>২<\/em><\/div><\/div>\n    <div class=\"card\">\n      <h2>বিষয় ও কনভার্সন পদ্ধতি<small>নাম লিখলেই পদ্ধতি নিজে বাছা হয়, চাইলে বদলান<\/small><\/h2>\n      <div class=\"scroll\"><table style=\"min-width:600px\">\n        <thead><tr><th>বিষয়<\/th><th style=\"width:110px\">পূর্ণমান<\/th><th style=\"width:210px\">পদ্ধতি<\/th><th style=\"width:70px;text-align:center\">গণনায়<\/th><th style=\"width:50px\"><\/th><\/tr><\/thead>\n        <tbody id=\"ieSubBody\"><\/tbody>\n      <\/table><\/div>\n      <datalist id=\"ieNames\"><option value=\"Listening\"><option value=\"Reading\"><option value=\"Writing\"><option value=\"Speaking\"><option value=\"Grammar\"><option value=\"Vocabulary\"><option value=\"Pronunciation\"><\/datalist>\n      <div class=\"row\">\n        <button class=\"primary\" id=\"ieAddSub\"><svg class=\"ic\"><use href=\"#i-plus\"/><\/svg>বিষয় যোগ<\/button>\n        <button id=\"ie4\">ডিফল্ট বিষয়<\/button>\n        <button id=\"ie5\">ডিফল্ট + Grammar<\/button>\n      <\/div>\n      <div class=\"hint\" id=\"ieHint\"><\/div><\/div>\n  <\/section>\n  <section class=\"step\" id=\"ieData\">\n    <div class=\"rail\"><div class=\"badge\"><svg class=\"ic\"><use href=\"#i-upload\"/><\/svg><em>৩<\/em><\/div><\/div>\n    <div class=\"card\">\n      <h2>প্রার্থীর নম্বর দিন<\/h2>\n      <div class=\"drop\" id=\"ieDrop\">\n        <label for=\"ieFile\"><svg class=\"ic\"><use href=\"#i-file\"/><\/svg><b>Excel (.xlsx) বা CSV ফাইল আপলোড করুন<\/b><\/label>\n        <div class=\"hint\" style=\"margin:2px 0 8px\">প্রথম কলাম ‘নাম’, বাকি কলামের শিরোনাম বিষয়ের নাম। পূর্ণমান লিখতে চাইলে Grammar/50 বা Grammar (50) লিখুন। একজনের জন্য ‘বিষয়, নম্বর’ দুই কলামের ফাইলও চলে।<\/div>\n        <input type=\"file\" id=\"ieFile\" accept=\".xlsx,.xls,.csv\">\n        <div class=\"row\" style=\"margin-top:10px\">\n          <button id=\"ieDemoXlsx\"><svg class=\"ic\"><use href=\"#i-down\"/><\/svg>ডেমো Excel<\/button>\n          <button id=\"ieDemoCsv\"><svg class=\"ic\"><use href=\"#i-down\"/><\/svg>ডেমো CSV<\/button>\n          <button id=\"ieSample\">উদাহরণ দেখুন<\/button>\n        <\/div>\n        <div class=\"msg\" id=\"ieMsg\"><\/div>\n      <\/div>\n      <div class=\"hint\" style=\"margin:0 0 8px\">অথবা নিচের টেবিলে নিজে নম্বর বসান:<\/div>\n      <div class=\"scroll\"><table style=\"min-width:560px\"><thead id=\"ieStuHead\"><\/thead><tbody id=\"ieStuBody\"><\/tbody><\/table><\/div>\n      <div class=\"row\">\n        <button class=\"primary\" id=\"ieAddStu\"><svg class=\"ic\"><use href=\"#i-plus\"/><\/svg>প্রার্থী যোগ<\/button>\n        <button id=\"ieClear\"><svg class=\"ic\"><use href=\"#i-trash\"/><\/svg>নম্বর মুছুন<\/button>\n      <\/div><\/div>\n  <\/section>\n  <section class=\"step\" id=\"ieResult\">\n    <div class=\"rail\"><div class=\"badge\"><svg class=\"ic\"><use href=\"#i-chart\"/><\/svg><em>৪<\/em><\/div><\/div>\n    <div class=\"card\">\n      <h2>ফলাফল<\/h2>\n      <div class=\"sheet-head\" id=\"ieHead\"><\/div>\n      <div id=\"ieRes\"><\/div>\n      <div class=\"row\" id=\"ieActions\" style=\"display:none\">\n        <button class=\"primary\" id=\"iePrint\"><svg class=\"ic\"><use href=\"#i-print\"/><\/svg>প্রিন্ট<\/button>\n        <button id=\"ieXlsx\"><svg class=\"ic\"><use href=\"#i-down\"/><\/svg>Excel<\/button>\n        <button id=\"ieCsv\"><svg class=\"ic\"><use href=\"#i-down\"/><\/svg>CSV<\/button>\n      <\/div><\/div>\n  <\/section>\n<\/main>\n<\/section>\n\n<section id=\"tut\" hidden>\n<div class=\"top\"><div class=\"top-in\">\n  <div class=\"tt\"><span class=\"logo\"><svg class=\"ic\"><use href=\"#i-logo\"/><\/svg><\/span>স্কোর কনভার্টার — টিউটোরিয়াল<\/div>\n  <a class=\"lnk p\" href=\"#tool\"><svg class=\"ic\"><use href=\"#i-chart\"/><\/svg>টুলটি ব্যবহার করুন<\/a>\n<\/div><\/div>\n<div class=\"main\">\n  <div class=\"tbar\">\n    <p>মোবাইল ও কম্পিউটারে কীভাবে ব্যবহার করবেন, ধাপে ধাপে দেখুন।<\/p>\n    <div class=\"seg2\">\n      <button id=\"bPc\"><svg class=\"ic\"><use href=\"#i-laptop\"/><\/svg>কম্পিউটার<\/button>\n      <button id=\"bMob\"><svg class=\"ic\"><use href=\"#i-phone\"/><\/svg>মোবাইল<\/button>\n    <\/div>\n  <\/div>\n\n  <div class=\"stage pc\" id=\"stage\">\n    <div class=\"lab\"><span class=\"bd\" id=\"lIc\"><\/span><div><small id=\"lNo\"><\/small><span id=\"lT\"><\/span><\/div><\/div>\n    <div class=\"dev\"><div class=\"bezel\"><div class=\"scr\" id=\"scr\"><\/div><\/div><div class=\"base\"><\/div><\/div>\n    <div class=\"cap\" id=\"cap\" aria-live=\"polite\"><\/div>\n  <\/div>\n\n  <div class=\"ctl\">\n    <button id=\"bPlay\" class=\"on\" aria-label=\"চালান/থামান\"><\/button>\n    <button id=\"bPrev\" aria-label=\"আগের ধাপ\"><svg class=\"ic\"><use href=\"#i-prev\"/><\/svg><\/button>\n    <button id=\"bNext\" aria-label=\"পরের ধাপ\"><svg class=\"ic\"><use href=\"#i-next\"/><\/svg><\/button>\n    <div class=\"segs\" id=\"segs\"><\/div>\n  <\/div>\n  <div class=\"hint\">কীবোর্ডে স্পেস = চালান/থামান, ← → = ধাপ বদল<\/div>\n<\/div>\n<\/section>\n\n<footer>তৈরি করেছেন <a href=\"https://www.facebook.com/mdsahjalal.net\" target=\"_blank\" rel=\"noopener noreferrer\">Md Shahjalal<\/a><\/footer>\n\n<template id=\"ad-left\"><\/template>\n<template id=\"ad-right\"><\/template>\n<template id=\"ad-mobile\"><\/template>\n\n<script>\n(function(){\n  var $ = function(id){return document.getElementById(id)};\n  var grades = [\n    {min:80,g:\"A+\",gp:5},{min:70,g:\"A\",gp:4},{min:60,g:\"A-\",gp:3.5},\n    {min:50,g:\"B\",gp:3},{min:40,g:\"C\",gp:2},{min:33,g:\"D\",gp:1},{min:0,g:\"F\",gp:0}\n  ];\n  var students = [];\n  var bn = \"০১২৩৪৫৬৭৮৯\";\n  var months = [\"জানুয়ারি\",\"ফেব্রুয়ারি\",\"মার্চ\",\"এপ্রিল\",\"মে\",\"জুন\",\"জুলাই\",\"আগস্ট\",\"সেপ্টেম্বর\",\"অক্টোবর\",\"নভেম্বর\",\"ডিসেম্বর\"];\n  function ic(n){return '<svg class=\"ic\"><use href=\"#i-'+n+'\"/><\/svg>'}\n  function toBn(s){return String(s).replace(/[0-9]/g,function(d){return bn[d]})}\n  function fromBn(s){return String(s).replace(/[০-৯]/g,function(d){return bn.indexOf(d)})}\n  function num(v){var n=parseFloat(fromBn(v).replace(/,/g,\".\"));return isNaN(n)?null:n}\n  function esc(s){return String(s).replace(/[&<>\"]/g,function(c){return {\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]})}\n  function fmt(n,d){return toBn(Number(n.toFixed(d)).toString())}\n  function fmtDate(v){\n    var m=/^(\\d{4})-(\\d{2})-(\\d{2})$/.exec(v||\"\"); if(!m) return \"\";\n    return toBn(parseInt(m[3],10))+\" \"+months[parseInt(m[2],10)-1]+\", \"+toBn(m[1]);\n  }\n\n  /* ---- exam info ---- */\n  var infoIds=[\"inst\",\"batch\",\"subj\",\"edate\"];\n  function getInfo(){return {inst:$(\"inst\").value.trim(),batch:$(\"batch\").value.trim(),subj:$(\"subj\").value.trim(),date:fmtDate($(\"edate\").value)}}\n  try{var saved=JSON.parse(localStorage.getItem(\"scInfo\")||\"{}\");infoIds.forEach(function(k){if(saved[k])$(k).value=saved[k]})}catch(e){}\n  infoIds.forEach(function(k){$(k).addEventListener(\"input\",function(){\n    try{var o={};infoIds.forEach(function(i){o[i]=$(i).value});localStorage.setItem(\"scInfo\",JSON.stringify(o))}catch(e){}\n    renderHead();\n  })});\n  function renderHead(){\n    var i=getInfo(), c=compute();\n    var h = i.inst ? '<h3>'+esc(i.inst)+'<\/h3>' : '<h3 class=\"ph\">প্রতিষ্ঠানের নাম<\/h3>';\n    h+='<div class=\"t\">পরীক্ষার ফলাফল<\/div><div class=\"meta\">';\n    if(i.batch) h+='<span>'+ic(\"users\")+esc(i.batch)+'<\/span>';\n    if(i.subj)  h+='<span>'+ic(\"book\")+'বিষয়: '+esc(i.subj)+'<\/span>';\n    if(i.date)  h+='<span>'+ic(\"cal\")+esc(i.date)+'<\/span>';\n    h+='<\/div><div class=\"conv\">মূল পূর্ণমান '+fmt(c.orig,2)+' → নতুন পূর্ণমান '+fmt(c.target,2)+'<\/div>';\n    $(\"sheetHead\").innerHTML=h;\n  }\n\n  /* ---- grades ---- */\n  function renderGrades(){\n    $(\"gradeBody\").innerHTML = grades.map(function(r,i){\n      return '<tr><td><input type=\"number\" min=\"0\" max=\"100\" value=\"'+r.min+'\" data-i=\"'+i+'\" data-k=\"min\"><\/td>'+\n             '<td><input value=\"'+esc(r.g)+'\" data-i=\"'+i+'\" data-k=\"g\"><\/td>'+\n             '<td><input type=\"number\" step=\"0.01\" value=\"'+r.gp+'\" data-i=\"'+i+'\" data-k=\"gp\"><\/td><\/tr>';\n    }).join(\"\");\n  }\n  $(\"gradeBody\").addEventListener(\"input\",function(e){\n    var t=e.target,i=t.dataset.i,k=t.dataset.k; if(i==null)return;\n    grades[i][k] = k===\"g\" ? t.value : (parseFloat(t.value)||0);\n    renderResults();\n  });\n  function gradeOf(pct){\n    var sorted = grades.slice().sort(function(a,b){return b.min-a.min});\n    for(var i=0;i<sorted.length;i++) if(pct>=sorted[i].min) return sorted[i];\n    return sorted[sorted.length-1] || {g:\"-\",gp:0};\n  }\n\n  /* ---- student inputs ---- */\n  function renderInputs(){\n    $(\"inputBody\").innerHTML = students.map(function(s,i){\n      return '<tr><td>'+toBn(i+1)+'<\/td>'+\n        '<td><input value=\"'+esc(s.name)+'\" data-i=\"'+i+'\" data-k=\"name\" placeholder=\"শিক্ষার্থীর নাম\"><\/td>'+\n        '<td><input type=\"number\" min=\"0\" step=\"any\" value=\"'+(s.score===null?\"\":s.score)+'\" data-i=\"'+i+'\" data-k=\"score\"><\/td>'+\n        '<td><input value=\"'+esc(s.comment||\"\")+'\" data-i=\"'+i+'\" data-k=\"comment\" placeholder=\"মন্তব্য লিখুন…\"><\/td>'+\n          '<td><button class=\"x\" data-del=\"'+i+'\" aria-label=\"মুছুন\">'+ic(\"x\")+'<\/button><\/td><\/tr>';\n    }).join(\"\");\n  }\n  $(\"inputBody\").addEventListener(\"input\",function(e){\n    var t=e.target,i=t.dataset.i,k=t.dataset.k; if(i==null)return;\n    students[i][k] = k===\"score\" ? num(t.value) : t.value;\n    renderResults();\n  });\n  $(\"inputBody\").addEventListener(\"click\",function(e){\n    var b=e.target.closest(\"button[data-del]\"); if(!b)return;\n    students.splice(+b.dataset.del,1); renderInputs(); renderResults();\n  });\n\n  /* ---- compute & render ---- */\n  function compute(){\n    var orig=num($(\"orig\").value)||100, target=num($(\"target\").value)||80;\n    var dec=+$(\"dec\").value, method=$(\"method\").value;\n    var valid=students.filter(function(s){return s.score!==null&&s.score!==undefined});\n    var max=valid.reduce(function(m,s){return Math.max(m,s.score)},0);\n    var baseIn=num($(\"base\").value);\n    var base = method===\"top\" ? (baseIn||max||orig) : orig;\n    return {orig:orig,target:target,dec:dec,method:method,max:max,base:base,factor:target/base};\n  }\n  function renderResults(){\n    var c=compute();\n    $(\"baseBox\").style.display = c.method===\"top\" ? \"\" : \"none\";\n    $(\"formula\").innerHTML = c.method===\"top\"\n      ? 'নতুন স্কোর = (মূল নম্বর ÷ <b>'+fmt(c.base,2)+'<\/b>) × <b>'+fmt(c.target,2)+'<\/b>'\n      : 'নতুন স্কোর = মূল নম্বর × (<b>'+fmt(c.target,2)+'<\/b> ÷ <b>'+fmt(c.orig,2)+'<\/b>)';\n    if(c.method===\"top\"&&c.target>c.orig)$(\"formula\").innerHTML+=' <small style=\"color:var(--warn)\">(ছোট থেকে বড় করতে ‘সমানুপাতিক’ বাছুন)<\/small>';\n    renderHead();\n\n    var rows = students.filter(function(s){return s.score!==null&&s.score!==undefined}).map(function(s){\n      var ns = Number(Math.min(s.score*c.factor, c.target).toFixed(c.dec));\n      var pct = ns/c.target*100, gr = gradeOf(pct);\n      return {name:s.name||\"—\",old:s.score,ns:ns,pct:pct,g:gr.g,gp:gr.gp,cm:String(s.comment||\"\").trim()};\n    });\n    if(!rows.length){\n      $(\"results\").innerHTML='<div class=\"empty\">নম্বর যোগ করলে এখানে ফলাফল দেখা যাবে।<\/div>';\n      $(\"actions\").style.display=\"none\"; window._rows=[]; return;\n    }\n    window._rows=rows; window._c=c;\n    var avgOld=rows.reduce(function(a,r){return a+r.old},0)/rows.length;\n    var avgNew=rows.reduce(function(a,r){return a+r.ns},0)/rows.length;\n    var pass=rows.filter(function(r){return r.g!==\"F\"}).length;\n    var top=Math.max.apply(null,rows.map(function(r){return r.ns}));\n\n    var over=c.method===\"ratio\"&&students.some(function(s){return s.score!=null&&s.score>c.orig});\n    var html=(over?'<p class=\"warn\">কিছু নম্বর মূল পূর্ণমান ('+fmt(c.orig,2)+') এর চেয়ে বেশি। মূল পূর্ণমান ঠিক আছে কিনা দেখুন।<\/p>':'')+'<div class=\"stats\">'+\n      '<div class=\"stat\">'+ic(\"users\")+'<div><b>'+toBn(rows.length)+'<\/b><span>মোট শিক্ষার্থী<\/span><\/div><\/div>'+\n      '<div class=\"stat\">'+ic(\"avg\")+'<div><b>'+fmt(avgOld,2)+' → '+fmt(avgNew,2)+'<\/b><span>গড় (মূল → নতুন)<\/span><\/div><\/div>'+\n      '<div class=\"stat\">'+ic(\"top\")+'<div><b>'+fmt(top,c.dec)+'<\/b><span>নতুন সর্বোচ্চ স্কোর<\/span><\/div><\/div>'+\n      '<div class=\"stat\">'+ic(\"check\")+'<div><b>'+toBn(pass)+' / '+toBn(rows.length)+'<\/b><span>উত্তীর্ণ<\/span><\/div><\/div><\/div>';\n    var hasC=rows.some(function(r){return r.cm});window._hasC=hasC;\n    html+='<div class=\"scroll\"><table style=\"min-width:'+(hasC?'720':'520')+'px\"><thead><tr><th>ক্রম<\/th><th>নাম<\/th><th class=\"num\">মূল নম্বর (/'+fmt(c.orig,2)+')<\/th><th class=\"num\">নতুন স্কোর (/'+fmt(c.target,2)+')<\/th><th class=\"num\">শতকরা<\/th><th>গ্রেড<\/th><th class=\"num\">জিপিএ<\/th>'+(hasC?'<th>মন্তব্য<\/th>':'')+'<\/tr><\/thead><tbody>';\n    rows.forEach(function(r,i){\n      html+='<tr><td>'+toBn(i+1)+'<\/td><td style=\"min-width:120px\">'+esc(r.name)+'<\/td><td class=\"num\">'+fmt(r.old,2)+'<\/td><td class=\"num\"><b>'+fmt(r.ns,c.dec)+'<\/b><\/td><td class=\"num\">'+fmt(r.pct,1)+'%<\/td><td><span class=\"g'+(r.g===\"F\"?\" f\":\"\")+'\">'+esc(r.g)+'<\/span><\/td><td class=\"num\">'+fmt(r.gp,2)+'<\/td>'+(hasC?'<td style=\"min-width:180px;white-space:normal\">'+esc(r.cm)+'<\/td>':'')+'<\/tr>';\n    });\n    $(\"results\").innerHTML=html+'<\/tbody><\/table><\/div>';\n    $(\"actions\").style.display=\"flex\";\n  }\n\n  /* ---- export ---- */\n  var HEAD=[\"নাম\",\"মূল নম্বর\",\"নতুন স্কোর\",\"শতকরা\",\"গ্রেড\",\"জিপিএ\"];\n  function heads(){return window._hasC?HEAD.concat([\"মন্তব্য\"]):HEAD}\n  function dataRows(){return window._rows.map(function(r){return [r.name,r.old,r.ns,Number(r.pct.toFixed(1)),r.g,r.gp].concat(window._hasC?[r.cm]:[])})}\n  function plain(sep){return [heads()].concat(dataRows()).map(function(r){return r.map(function(v){v=String(v).replace(/\\s*\\n\\s*/g,\" \");return sep===\",\"&&/[\",]/.test(v)?'\"'+v.replace(/\"/g,'\"\"')+'\"':v}).join(sep)}).join(\"\\n\")}\n  function save(blob,name){var a=document.createElement(\"a\");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()}\n  $(\"csv\").onclick=function(){save(new Blob([\"\\ufeff\"+plain(\",\")],{type:\"text/csv;charset=utf-8\"}),\"converted-scores.csv\")};\n  $(\"copy\").onclick=function(){\n    var sp=$(\"copy\").querySelector(\"span\");\n    if(navigator.clipboard) navigator.clipboard.writeText(plain(\"\\t\")).then(function(){sp.textContent=\"কপি হয়েছে ✓\";setTimeout(function(){sp.textContent=\"কপি\"},1500)},function(){});\n  };\n  $(\"print\").onclick=function(){window.print()};\n  $(\"xlsx\").onclick=function(){\n    if(typeof XLSX===\"undefined\"){alert(\"Excel লাইব্রেরি লোড হয়নি। CSV ডাউনলোড ব্যবহার করুন।\");return}\n    var i=getInfo(), aoa=[[i.inst||\"\"],[\"ব্যাচ/শ্রেণি: \"+i.batch,\"বিষয়: \"+i.subj,\"তারিখ: \"+i.date],[]];\n    aoa=aoa.concat([heads()],dataRows());\n    var wb=XLSX.utils.book_new();\n    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa),\"Result\");\n    XLSX.writeFile(wb,\"converted-scores.xlsx\");\n  };\n\n  /* ---- import ---- */\n  function setMsg(t,err){var m=$(\"fileMsg\");m.textContent=t;m.className=\"msg\"+(err?\" err\":\"\")}\n  function parseCsv(text){\n    text=text.replace(/^\\ufeff/,\"\");\n    var rows=[],row=[],cur=\"\",q=false;\n    for(var i=0;i<text.length;i++){\n      var ch=text[i];\n      if(q){ if(ch==='\"'){ if(text[i+1]==='\"'){cur+='\"';i++} else q=false } else cur+=ch }\n      else if(ch==='\"') q=true;\n      else if(ch===\",\"||ch===\"\\t\"||ch===\";\"){row.push(cur);cur=\"\"}\n      else if(ch===\"\\n\"||ch===\"\\r\"){ if(ch===\"\\r\"&&text[i+1]===\"\\n\")i++; row.push(cur);rows.push(row);row=[];cur=\"\"   bn:{btn:"সার্টিফিকেট তৈরি করুন",col:"সার্টিফিকেটের রঙ",themes:{cyan:"সায়ান",purple:"বেগুনি",cyanPurple:"সায়ান + বেগুনি",orange:"কমলা"},busy:"তৈরি হচ্ছে",none:"সার্টিফিকেট তৈরির মতো কোনো ফলাফল নেই।",err:"পিডিএফ তৈরি করা যায়নি। ইন্টারনেট সংযোগ দেখে আবার চেষ্টা করুন।"}
}[LANG];

function en(s){return String(s).replace(/[০-৯]/g,function(d){return "০১২৩৪৫৬৭৮৯".indexOf(d)})}
function fmtDate(d){return d.getDate()+" "+MONTHS[d.getMonth()]+" "+d.getFullYear()}
function examDate(){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(($("ieDate")||{}).value||"");return m?(+m[3])+" "+MONTHS[+m[2]-1]+" "+m[1]:""}
function loadJs(src,ok){return new Promise(function(res,rej){if(ok())return res();var s=document.createElement("script");s.src=src;s.onload=function(){ok()?res():rej()};s.onerror=rej;document.head.appendChild(s)})}
function loadImg(src){return new Promise(function(res,rej){var i=new Image();i.onload=function(){res(i)};i.onerror=rej;i.src=src})}

/* Read the Result table of the Band Score page (works for English and Bengali pages) */
function scrape(){
  var t=document.querySelector("#ieRes table");if(!t)return [];
  var ths=[].map.call(t.querySelectorAll("thead th"),function(x){return x.textContent.replace(/\s*\*\s*$/,"").trim()});
  var n=ths.length,rows=[];
  [].forEach.call(t.querySelectorAll("tbody tr"),function(tr){
    var td=tr.children;if(td.length<n)return;
    var subs=[];
    for(var i=1;i<n-3;i++){var b=td[i].querySelector("b");subs.push({n:ths[i],v:en(b?b.textContent:td[i].textContent).trim()})}
    var pref=["reading","writing","listening","speaking"];
    subs.sort(function(a,b){var x=pref.indexOf(a.n.toLowerCase()),y=pref.indexOf(b.n.toLowerCase());return (x<0?9:x)-(y<0?9:y)});
    rows.push({name:td[0].textContent.trim(),subs:subs,overall:en(td[n-3].textContent).trim(),cefr:en(td[n-2].textContent).trim(),grade:en(td[n-1].textContent).trim()});
  });
  return rows;
}

function fit(ctx,s,font,size,maxW){while(size>12){ctx.font=font.replace("%s",size);if(ctx.measureText(s).width<=maxW)break;size--}return size}
function txt(ctx,s,x,y,font,color,align){ctx.font=font;ctx.fillStyle=color;ctx.textAlign=align||"left";ctx.textBaseline="middle";ctx.fillText(s,x,y)}

function hatch(ctx){
  var c=HATCH[CFG.theme]||HATCH.cyan,step=10*Math.SQRT2;
  ctx.save();ctx.lineWidth=1.1;
  ctx.strokeStyle=c[0];ctx.beginPath();
  for(var k=-H;k<=W+2;k+=step){ctx.moveTo(k,0);ctx.lineTo(k+H,H)}
  ctx.stroke();
  ctx.strokeStyle=c[1];ctx.beginPath();
  for(var j=0;j<=W+H+2;j+=step){ctx.moveTo(j,0);ctx.lineTo(j-H,H)}
  ctx.stroke();ctx.restore();
}
function drawBg(ctx,imgs){
  var a=160*Math.PI/180,sx=Math.sin(a),sy=-Math.cos(a),len=Math.abs(W*Math.sin(a))+Math.abs(H*Math.cos(a)),cx=W/2,cy=H/2;
  var g=ctx.createLinearGradient(cx-sx*len/2,cy-sy*len/2,cx+sx*len/2,cy+sy*len/2);
  (THEMES[CFG.theme]||THEMES.cyan).forEach(function(s){g.addColorStop(s[0],s[1])});
  ctx.fillStyle=g;ctx.fillRect(0,0,W+2,H+2);
  ctx.save();ctx.translate(W*.5,H*.48);ctx.scale(1,(H*.6)/(W*.75));
  var r=ctx.createRadialGradient(0,0,0,0,0,W*.75);r.addColorStop(0,"rgba(255,255,255,.75)");r.addColorStop(.7,"rgba(255,255,255,0)");
  ctx.fillStyle=r;ctx.fillRect(-W,-W,W*2,W*2);ctx.restore();
  hatch(ctx);
  ctx.save();ctx.globalAlpha=.09;ctx.drawImage(imgs.elc,W/2-260,H/2-260,520,520);ctx.restore();
  /* header */
  var cw=62*imgs.cam.width/imgs.cam.height;
  ctx.drawImage(imgs.cam,LM,44+(92-62)/2,cw,62);
  var ew=92*imgs.elc.width/imgs.elc.height;
  ctx.drawImage(imgs.elc,RM-ew,44,ew,92);
  txt(ctx,CFG.centre,W/2,176,"700 25px "+SERIF,NAVY,"center");
  txt(ctx,CFG.address,W/2,201,"13px "+SANS,MUTE,"center");
  var rg=ctx.createLinearGradient(LM,0,RM,0);rg.addColorStop(0,"rgba(191,150,80,0)");rg.addColorStop(.5,GOLD);rg.addColorStop(1,"rgba(191,150,80,0)");
  ctx.fillStyle=rg;ctx.fillRect(LM,221,RM-LM,1);
}
function drawStatic(ctx,imgs,issue){
  var sw=62*imgs.sig.width/imgs.sig.height;
  ctx.drawImage(imgs.sig,LM,913,sw,62);
  ctx.fillStyle=NAVY;ctx.fillRect(LM,978,200,1);
  txt(ctx,CFG.signer,LM,994,"700 15px "+SANS,NAVY);
  txt(ctx,CFG.role,LM,1010,"13px "+SANS,MUTE);
  txt(ctx,CFG.centre,LM,1026,"700 13px "+SANS,NAVY);
  txt(ctx,"Date of Issue: "+issue,LM,1058,"11.5px "+SANS,MUTE);
}
function drawPage(ctx,imgs,d,ex,issue){
  ctx.clearRect(0,0,W,H);
  drawBg(ctx,imgs);
  txt(ctx,"This is to certify that",LM,295,"14px "+SANS,MUTE);
  var nm=d.name&&d.name!=="—"?d.name:"";
  var ns=fit(ctx,nm,"700 %spx "+SANS,25,RM-LM);
  txt(ctx,nm,LM,326,"700 "+ns+"px "+SANS,INK);
  txt(ctx,"has been awarded",LM,370,"14px "+SANS,MUTE);
  var gr=d.grade&&d.grade!=="—"?d.grade:"";
  var gs=fit(ctx,gr,"700 %spx "+SANS,30,RM-LM);
  txt(ctx,gr,LM,403,"700 "+gs+"px "+SANS,INK);
  txt(ctx,"in the",LM,444,"14px "+SANS,MUTE);
  var es=fit(ctx,ex.name,"700 %spx "+SANS,27,RM-LM);
  txt(ctx,ex.name,LM,476,"700 "+es+"px "+SANS,INK);
  txt(ctx,"Council of Europe Level",LM,542,"14px "+SANS,MUTE);
  txt(ctx,d.cefr||"—",LM,574,"700 27px "+SANS,INK);
  txt(ctx,ex.head,LM,621,"14px "+SANS,MUTE);
  txt(ctx,d.overall||"—",LM,653,"700 27px "+SANS,INK);
  var y=693;
  d.subs.forEach(function(s){txt(ctx,s.n,LM,y,"14px "+SANS,MUTE);txt(ctx,s.v||"—",LM+110,y,"700 14px "+SANS,INK);y+=21.7});
  var ed=examDate();
  if(ed){var dy=Math.max(819,y+36);txt(ctx,"Date of Examination",LM,dy,"11.5px "+SANS,MUTE);txt(ctx,ed,LM,dy+18,"700 14px "+SANS,INK)}
  drawStatic(ctx,imgs,issue);
}

var busy=false;
function make(btn){
  if(busy)return;
  var rows=scrape();if(!rows.length){alert(T.none);return}
  var sel=$("ieCertTheme");if(sel&&THEMES[sel.value])CFG.theme=sel.value;
  var key=($("ieExam")||{}).value||"ielts",ex={name:EXAMS[key]||key,head:HEADS[key]||"Overall Score"};
  var issue=fmtDate(new Date()),label=btn.innerHTML;busy=true;btn.disabled=true;
  function prog(s){btn.innerHTML='<svg class="ic"><use href="#i-award"/></svg>'+s}
  prog(T.busy+"…");
  Promise.all([
    loadJs("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",function(){return window.jspdf&&window.jspdf.jsPDF}),
    loadImg(IMG.cam),loadImg(IMG.elc),loadImg(IMG.sig),
    document.fonts&&document.fonts.load?document.fonts.load('700 20px "Hind Siliguri"','অআক').catch(function(){}):0
  ]).then(function(r){
    var imgs={cam:r[1],elc:r[2],sig:r[3]},S=CFG.scale;
    var cv=document.createElement("canvas");cv.width=Math.ceil(W*S);cv.height=Math.ceil(H*S);
    var ctx=cv.getContext("2d");
    var pdf=new window.jspdf.jsPDF({unit:"mm",format:"a4",orientation:"portrait",compress:true});
    var k=0;
    return new Promise(function(done,fail){
      (function next(){
        if(k>=rows.length)return done(pdf);
        try{
          ctx.setTransform(S,0,0,S,0,0);
          drawPage(ctx,imgs,rows[k],ex,issue);
          if(k)pdf.addPage();
          pdf.addImage(cv.toDataURL("image/jpeg",CFG.quality),"JPEG",0,0,210,297,undefined,"FAST");
        }catch(e){return fail(e)}
        k++;prog(T.busy+" "+k+"/"+rows.length);
        setTimeout(next,0);
      })();
    });
  }).then(function(pdf){
    pdf.save("ELC-certificates-"+ex.name.replace(/\s+/g,"-")+".pdf");
  }).catch(function(e){console.error(e);alert(T.err)}).then(function(){busy=false;btn.disabled=false;btn.innerHTML=label});
}

function init(){
  var box=$("ieActions");if(!box||$("ieCert"))return;
  var b=document.createElement("button");b.id="ieCert";b.className="primary";
  b.innerHTML='<svg class="ic"><use href="#i-award"/></svg>'+T.btn;
  b.onclick=function(){make(b)};
  var wrap=document.createElement("span");
  wrap.style.cssText="display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap";
  var lab=document.createElement("span");lab.textContent=T.col+":";lab.style.cssText="font-size:.88rem;opacity:.8";
  var sel=document.createElement("select");sel.id="ieCertTheme";sel.style.cssText="width:auto;padding:8px 10px";sel.setAttribute("aria-label",T.col);
  ["cyan","purple","cyanPurple","orange"].forEach(function(k){var o=document.createElement("option");o.value=k;o.textContent=T.themes[k];sel.appendChild(o)});
  var saved="";try{saved=localStorage.getItem("ieCertTheme")||""}catch(e){}
  sel.value=THEMES[saved]?saved:(THEMES[CFG.theme]?CFG.theme:"cyan");
  sel.onchange=function(){try{localStorage.setItem("ieCertTheme",sel.value)}catch(e){}};
  wrap.appendChild(lab);wrap.appendChild(sel);
  box.appendChild(b);box.appendChild(wrap);
}
window.__ELCCert={scrape:scrape,drawPage:drawPage,imgs:IMG,examDate:examDate};
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init();
})();


})();
</script>
